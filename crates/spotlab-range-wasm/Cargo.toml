[package]
name = "spotlab-range-wasm"
version = "0.1.0"
edition.workspace = true
description = "wasm-bindgen shim exposing spotlab-range's parser/serializer to JavaScript"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spotlab-range = { path = "../spotlab-range", default-features = false, features = [
  "serde",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = "1"
serde-wasm-bindgen = "0.6"

# rustc emits bulk-memory instructions by default for wasm32-unknown-unknown; wasm-pack's
# vendored wasm-opt rejects them unless explicitly told to allow the feature. Saturating
# (nontrapping) float-to-int conversions are emitted too, but only from certain codegen shapes —
# removing the ranks()/suits()/combos() shims exposed one such path (i32.trunc_sat_f64_u), so this
# flag is now load-bearing rather than merely defensive.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
]
